<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KitOut - On-Site SnagList Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-top: 6px solid #FFC107;
            box-sizing: border-box;
        }
        .back-btn {
            color: #FFC107;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 0.95em;
        }
        h1 {
            color: #FFC107;
            margin: 0 0 5px 0;
            font-size: 1.8em;
            font-weight: 800;
        }
        .tagline {
            color: #aaa;
            font-size: 0.9em;
            font-style: italic;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95em;
            color: #ddd;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 80px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #FFC107;
            outline: none;
        }
        .submit-btn {
            display: block;
            width: 100%;
            background: #FFC107;
            color: #111;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            border: none;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: #e0a800; }
        .snag-list {
            margin-top: 30px;
            border-top: 1px dashed #444;
            padding-top: 20px;
        }
        .snag-card {
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #f44336;
            position: relative;
        }
        .snag-card.resolved {
            border-left-color: #4caf50;
            opacity: 0.7;
        }
        .snag-meta {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 5px;
        }
        .snag-desc {
            font-weight: 600;
            font-size: 1em;
            margin-bottom: 10px;
            padding-right: 90px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 0.75em;
            font-weight: 700;
            border-radius: 4px;
            background: #f44336;
            color: #fff;
        }
        .resolved .status-badge {
            background: #4caf50;
        }
        .resolve-btn {
            position: absolute;
            right: 15px;
            bottom: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            font-size: 0.8em;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .resolve-btn:hover {
            border-color: #FFC107;
            color: #FFC107;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">⬅️ Back to Dashboard</a>
        <h1>📋 SnagList Tracker</h1>
        <div class="tagline">Log job-site defects and sign them off live with clients.</div>

        <div class="input-group">
            <label>Client Name / Project Reference</label>
            <input type="text" id="clientName" placeholder="e.g., Smith Extension">
        </div>

        <div class="input-group">
            <label>Location / Room</label>
            <input type="text" id="roomLocation" placeholder="e.g., Master Bedroom">
        </div>

        <div class="input-group">
            <label>Defect Description</label>
            <textarea id="snagDesc" placeholder="e.g., Paint scratch near door frame or cracked floor tile..."></textarea>
        </div>

        <button class="submit-btn" onclick="addSnagItem()">➕ Log New Snag Item</button>

        <div class="snag-list" id="snagFeed">
            <div class="snag-card" id="snag-sample">
                <div class="snag-meta">Project: Smith Extension | Room: Master Bedroom</div>
                <div class="snag-desc">Touch up paint scratch near door frame</div>
                <div class="status-badge">🔴 OPEN</div>
                <button class="resolve-btn" onclick="resolveSnag('snag-sample')">Mark Fixed</button>
            </div>
        </div>
    </div>

    <script>
        function addSnagItem() {
            const client = document.getElementById("clientName").value.trim();
            const location = document.getElementById("roomLocation").value.trim();
            const desc = document.getElementById("snagDesc").value.trim();

            if (!client || !location || !desc) {
                alert("Please fill out all fields to log a snag.");
                return;
            }

            const timestamp = new Date().toLocaleDateString("en-GB");
            const uniqueId = "snag-" + Date.now();

            const card = document.createElement("div");
            card.className = "snag-card";
            card.id = uniqueId;
            card.innerHTML = `
                <div class="snag-meta">Project: ${escapeHtml(client)} | Room: ${escapeHtml(location)} | Added: ${timestamp}</div>
                <div class="snag-desc">${escapeHtml(desc)}</div>
                <div class="status-badge">🔴 OPEN</div>
                <button class="resolve-btn" onclick="resolveSnag('${uniqueId}')">Mark Fixed</button>
            `;

            const feed = document.getElementById("snagFeed");
            feed.insertBefore(card, feed.firstChild);

            document.getElementById("clientName").value = "";
            document.getElementById("roomLocation").value = "";
            document.getElementById("snagDesc").value = "";
        }

        function resolveSnag(id) {
            const card = document.getElementById(id);
            if (card) {
                card.classList.add("resolved");
                const badge = card.querySelector(".status-badge");
                badge.innerText = "🟢 FIXED";
                const btn = card.querySelector(".resolve-btn");
                if (btn) btn.remove();
            }
        }

        function escapeHtml(value) {
            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
